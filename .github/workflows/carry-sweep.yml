name: carry sweep (real data)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/crypto-algo-trading-bot-sti7oe
    paths:
      - "algo_engine/scripts/run_carry.py"
      - "algo_engine/carry.py"
      - ".github/workflows/carry-sweep.yml"

jobs:
  carry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml
      - name: Run delta-neutral funding carry sweep
        run: python -m algo_engine.scripts.run_carry
