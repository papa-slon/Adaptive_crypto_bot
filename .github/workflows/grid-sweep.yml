name: grid sweep (real data)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/crypto-algo-trading-bot-sti7oe
    paths:
      - "algo_engine/scripts/run_grid.py"
      - "algo_engine/scripts/run_funding_grid.py"
      - "algo_engine/grid.py"
      - ".github/workflows/grid-sweep.yml"

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml
      - name: Run adaptive grid sweep on real data
        run: python -m algo_engine.scripts.run_grid
      - name: Run funding-aware grid sweep on real data
        run: python -m algo_engine.scripts.run_funding_grid
